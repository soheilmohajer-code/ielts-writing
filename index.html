<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D7D9DD;--sheet:#FFFFFF;--sheet2:#EFF0F2;--ink:#191919;--muted:#5C5C5C;--line:#C4C8CE;
  --accent:#005B96;--accent-d:#00487A;--head:#141414;--head-mut:#BDBDBD;
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;--fa:"Estedad",Arial,Tahoma,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1116;--sheet:#1A1F27;--sheet2:#131820;--ink:#E9EBF0;--muted:#9AA2B3;--line:#2D3542;--accent:#6FA9DC;--accent-d:#8FC0E8;--head:#000;--head-mut:#A9A9A9}
}
:root[data-theme="dark"]{--bg:#0E1116;--sheet:#1A1F27;--sheet2:#131820;--ink:#E9EBF0;--muted:#9AA2B3;--line:#2D3542;--accent:#6FA9DC;--accent-d:#8FC0E8;--head:#000;--head-mut:#A9A9A9}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans)}
html[lang="fa"] body{font-family:var(--fa);line-height:1.9}
html[lang="fa"] .lang-btn{font-family:var(--fa)}
.top{background:var(--head);color:#fff;border-bottom:3px solid var(--accent);padding-top:env(safe-area-inset-top,0px)}
.top-row{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 20px}
.ielts{font-size:23px;font-weight:800;letter-spacing:.14em;color:#fff;direction:ltr}
.controls{display:flex;gap:8px;margin-inline-start:auto}
.icon-btn,.lang-btn{height:36px;border-radius:3px;border:1px solid #5c5c5c;background:transparent;color:#fff;cursor:pointer;font-weight:700;font-size:13px}
.icon-btn{width:36px;display:grid;place-items:center}
.lang-btn{padding:0 12px}
.icon-btn:hover,.lang-btn:hover{border-color:#fff}
.icon-btn svg{width:18px;height:18px}
#themeBtn .sun{display:none}
:root[data-theme="dark"] #themeBtn .moon{display:none}
:root[data-theme="dark"] #themeBtn .sun{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #themeBtn .moon{display:none}:root:not([data-theme="light"]) #themeBtn .sun{display:block}}
.wrap{flex:1;width:100%;max-width:900px;margin:0 auto;padding:44px 20px 60px}
h1{font-size:30px;line-height:1.3;margin:0 0 8px}
html[lang="fa"] h1,html[lang="fa"] h2{font-weight:800}
.lead{color:var(--muted);margin:0 0 28px;max-width:60ch}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.choices{grid-template-columns:1fr}}
.choice{--ca:var(--accent);display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--line);border-inline-start:4px solid var(--ca);border-radius:4px;padding:24px;color:inherit;text-decoration:none}
.choice:hover{border-color:var(--ca);background:var(--sheet2)}
.choice.l{--ca:#2E7BC4}
.choice.r{--ca:#1E8E7A}
.choice.w{--ca:#7A5BC0}
.choice.s{--ca:#C07A1A}
.chead{display:flex;align-items:center;gap:12px}
.ic{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:24px;line-height:1;background:var(--sheet2);border:1px solid var(--ca)}
.choice:focus-visible,.icon-btn:focus-visible,.lang-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice h2{font-size:22px;margin:0}
.choice p{margin:0;color:var(--muted)}
.go{margin-top:10px;font-weight:700;color:var(--accent)}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center}
.credit{display:block;margin-top:6px;font-weight:700;letter-spacing:.04em}
</style>
</head>
<body>
<header class="top"><div class="top-row">
  <span class="ielts">IELTS</span>
  <div class="controls">
    <button class="icon-btn" id="themeBtn" aria-label="Theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="lang-btn" id="langBtn">FA / EN</button>
  </div>
</div></header>
<main class="wrap">
  <h1 data-i18n="h1">Choose a practice section</h1>
  <p class="lead" data-i18n="lead"></p>
  <div class="choices">
    <a class="choice l" href="listening.html">
      <div class="chead"><span class="ic" aria-hidden="true">🎧</span><h2 data-i18n="lTitle">Listening</h2></div>
      <p data-i18n="lText"></p>
      <span class="go" data-i18n="go">Start</span>
    </a>
    <a class="choice r" href="reading.html">
      <div class="chead"><span class="ic" aria-hidden="true">📖</span><h2 data-i18n="rTitle">Reading</h2></div>
      <p data-i18n="rText"></p>
      <span class="go" data-i18n="go">Start</span>
    </a>
    <a class="choice w" href="copy-test.html">
      <div class="chead"><span class="ic" aria-hidden="true">✍️</span><h2 data-i18n="wTitle">Writing</h2></div>
      <p data-i18n="wText"></p>
      <span class="go" data-i18n="go">Start</span>
    </a>
    <a class="choice s" href="speaking.html">
      <div class="chead"><span class="ic" aria-hidden="true">🎤</span><h2 data-i18n="sTitle">Speaking</h2></div>
      <p data-i18n="sText"></p>
      <span class="go" data-i18n="go">Start</span>
    </a>
  </div>
  <div class="foot"><span class="credit">Built by zenithra / Soheil Mohajer &amp; Shayan Shamsvari</span></div>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const I={
en:{h1:'Choose a practice section',lead:'Four sections, one place to practise each IELTS skill.',
 lTitle:'Listening',lText:'Exam mode plays the audio once with the text hidden. Dictation mode checks what you type, sentence by sentence.',
 rTitle:'Reading',rText:'Read your own passage. Tap any word or sentence for a Persian translation, or translate everything.',
 wTitle:'Writing',wText:'Copy test: type a passage exactly against the clock, then see every missing or extra word marked.',
 sTitle:'Speaking',sText:'Speaking chunks, American-voice read-aloud, pronunciation check, Persian translation and flashcards.',go:'Start'},
fa:{h1:'بخش تمرین رو انتخاب کن',lead:'چهار بخش، برای تمرین هر مهارت آیلتس.',
 lTitle:'لیسنینگ',lText:'حالت آزمون صدا رو یک‌بار و با متن مخفی پخش می‌کنه. حالت دیکته چیزی که تایپ می‌کنی رو جمله‌به‌جمله چک می‌کنه.',
 rTitle:'ریدینگ',rText:'متن خودت رو بخون. روی هر کلمه یا جمله بزن تا ترجمهٔ فارسی ببینی، یا کل متن رو ترجمه کن.',
 wTitle:'رایتینگ',wText:'Copy test: یه متن رو دقیق و با تایمر تایپ کن، بعد تک‌تک کلمهٔ جاافتاده یا اضافه مشخص می‌شه.',
 sTitle:'اسپیکینگ',sText:'تکه‌بندی گفتاری، خواندن با لهجهٔ آمریکایی، چک تلفظ، ترجمهٔ فارسی و فلش‌کارت.',go:'شروع'}
};
function setLang(l){
  LS.set('ielts-lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=I[l][e.dataset.i18n]);
}
function setTheme(t){document.documentElement.dataset.theme=t;LS.set('ielts-theme',t)}
setTheme(LS.get('ielts-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
let lang=LS.get('ielts-lang','en')==='fa'?'fa':'en';setLang(lang);
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#langBtn').onclick=()=>{lang=lang==='fa'?'en':'fa';setLang(lang)};
})();
</script>
</body>
</html>
