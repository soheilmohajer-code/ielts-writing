<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Listening practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D7D9DD;--sheet:#FFFFFF;--sheet2:#EFF0F2;--ink:#191919;--muted:#5C5C5C;--line:#C4C8CE;
  --accent:#005B96;--accent-d:#00487A;--accent-ink:#FFFFFF;
  --head:#141414;--head-mut:#BDBDBD;
  --warn:#8A5A00;--warn-bg:#FFF3CF;--bad:#B00020;--bad-bg:#FBE3E8;--good:#0B6E3F;--good-bg:#E1F2E7;
  --now:#FFF0B3;--hatch:rgba(0,91,150,.14);
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --fa:"Estedad",Arial,Tahoma,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116;--sheet:#1A1F27;--sheet2:#131820;--ink:#E9EBF0;--muted:#9AA2B3;--line:#2D3542;
    --accent:#6FA9DC;--accent-d:#8FC0E8;--accent-ink:#0A1626;--head:#000;--head-mut:#A9A9A9;
    --warn:#FFC861;--warn-bg:#3A2C0C;--bad:#FF9AAB;--bad-bg:#471B23;--good:#7BD9A5;--good-bg:#143A26;--now:#4A3B10;--hatch:rgba(111,169,220,.18);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116;--sheet:#1A1F27;--sheet2:#131820;--ink:#E9EBF0;--muted:#9AA2B3;--line:#2D3542;
  --accent:#6FA9DC;--accent-d:#8FC0E8;--accent-ink:#0A1626;--head:#000;--head-mut:#A9A9A9;
  --warn:#FFC861;--warn-bg:#3A2C0C;--bad:#FF9AAB;--bad-bg:#471B23;--good:#7BD9A5;--good-bg:#143A26;--now:#4A3B10;--hatch:rgba(111,169,220,.18);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;background:var(--bg)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans)}
html[lang="fa"] body{font-family:var(--fa);line-height:1.9}
html[lang="fa"] .btn,html[lang="fa"] .lang-btn,html[lang="fa"] select,html[lang="fa"] input,html[lang="fa"] textarea.paste{font-family:var(--fa)}
html[lang="fa"] h1,html[lang="fa"] h2{font-weight:800}
button,select,input,textarea{font-family:inherit}

.top{flex:none;background:var(--head);color:#fff;border-bottom:3px solid var(--accent);padding-top:env(safe-area-inset-top,0px)}
.top-row{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 20px}
.brand{display:flex;align-items:center;gap:12px;direction:ltr}
.ielts{font-size:23px;font-weight:800;letter-spacing:.14em;color:#fff;text-decoration:none}
.vdiv{width:1px;height:30px;background:#4d4d4d;flex:none}
.section{font-size:13px;font-weight:700;color:var(--head-mut);white-space:nowrap}
.controls{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.icon-btn,.lang-btn,.home-link{height:40px;border-radius:3px;border:1px solid #5c5c5c;background:transparent;color:#fff;cursor:pointer;font-size:13px;font-weight:700}
.icon-btn{width:40px;display:grid;place-items:center}
.lang-btn,.home-link{padding:0 12px;display:flex;align-items:center;text-decoration:none}
.icon-btn:hover,.lang-btn:hover,.home-link:hover{border-color:#fff}
.icon-btn svg{width:18px;height:18px}
#themeBtn .sun{display:none}
:root[data-theme="dark"] #themeBtn .moon{display:none}
:root[data-theme="dark"] #themeBtn .sun{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #themeBtn .moon{display:none}
  :root:not([data-theme="light"]) #themeBtn .sun{display:block}
}

.view{flex:1;min-height:0;overflow-y:auto}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px calc(60px + env(safe-area-inset-bottom,0px))}
h1{font-size:28px;line-height:1.3;font-weight:700;margin:0 0 8px}
h2{font-size:20px;margin:0 0 6px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 22px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:22px;margin-bottom:14px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.paste{display:block;width:100%;min-height:150px;resize:vertical;padding:12px 14px;background:var(--sheet);color:var(--ink);border:1px solid #9AA0A8;border-radius:3px;font-size:16px;line-height:1.7;direction:ltr;text-align:left}
.paste.short{min-height:110px}
.paste:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.meta{margin-top:6px;font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;margin:16px 0}
.field{min-width:0}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
select{padding:9px 10px;background:var(--sheet);color:var(--ink);border:1px solid #9AA0A8;border-radius:3px;font-size:16px;max-width:100%}
input[type=range]{accent-color:var(--accent);width:150px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{font-size:15px;font-weight:700;padding:11px 24px;min-height:44px;border-radius:3px;border:1px solid transparent;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:hover:not(:disabled){background:var(--accent-d)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:var(--sheet);color:var(--ink);border-color:#9AA0A8}
.ghost:hover:not(:disabled){border-color:var(--ink)}
.ghost:disabled{opacity:.5;cursor:not-allowed}
.big{width:100%;font-size:18px;min-height:56px}
.mini{font-size:13px;font-weight:700;min-width:40px;min-height:40px;padding:6px 10px;border:1px solid #9AA0A8;border-radius:3px;background:var(--sheet);color:var(--ink);cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.icon-btn:focus-visible,.lang-btn:focus-visible,.mini:focus-visible,.home-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{margin-top:12px;font-size:13.5px;color:var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:3px}
.status{margin:12px 0;padding:10px 12px;background:var(--sheet2);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:3px}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center}
.credit{display:block;margin-top:6px;font-weight:700;letter-spacing:.04em}
.backrow{display:flex;justify-content:center;margin-top:18px}
.backrow .btn{text-decoration:none}

/* transcript + dictation */
.tr-list{direction:ltr;text-align:left;margin-top:14px}
.tr-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.75}
.tr-item:last-child{border-bottom:0}
.tr-item.now{background:var(--now)}
.prog{font-weight:700;margin-bottom:10px}
.diff{direction:ltr;text-align:left;background:var(--sheet2);border:1px solid var(--line);border-radius:3px;padding:14px 16px;font-size:17px;line-height:1.9;margin-top:12px}
.m{background:var(--bad-bg);color:var(--bad);font-weight:700;padding:0 4px;border-radius:2px}
.x{background:var(--warn-bg);color:var(--warn);text-decoration:line-through;font-weight:700;padding:0 4px;border-radius:2px}
.score{font-weight:800;font-size:18px;margin-top:12px}
.score.good{color:var(--good)}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px}
.sum-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1;min-width:130px;background:var(--sheet2);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.stat .v{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.weak{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);direction:ltr;text-align:left}

@media (max-width:700px){
  .section{display:none}
  .top-row{padding:8px 12px;gap:10px}
  .wrap{padding:20px 14px calc(50px + env(safe-area-inset-bottom,0px))}
  .card{padding:16px}
  h1{font-size:24px}
  .field{flex:1 1 45%}
  input[type=range]{width:100%}
  .actions .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><a class="ielts" href="index.html" title="Home">IELTS</a><span class="vdiv" aria-hidden="true"></span><span class="section" data-i18n="brandSub">Listening practice</span></div>
    <div class="controls">
      <a class="home-link" href="index.html" data-i18n="back">Home</a>
      <button class="icon-btn" id="themeBtn" aria-label="Theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="lang-btn" id="langBtn">FA / EN</button>
    </div>
  </div>
</header>

<main class="view" id="view">
<div class="wrap">

<!-- setup -->
<section id="vSetup">
  <h1 data-i18n="title">Listening practice</h1>
  <p class="lead" data-i18n="lead"></p>
  <div class="card">
    <label class="lbl" for="src" data-i18n="lblText">English text</label>
    <textarea class="paste" id="src" data-i18n-ph="ph" spellcheck="false"></textarea>
    <div class="meta" id="meta"></div>
    <div class="row">
      <div class="field"><label for="mode" data-i18n="lblMode">Mode</label>
        <select id="mode"><option value="exam" data-i18n="mExam"></option><option value="dict" data-i18n="mDict"></option></select></div>
      <div class="field"><label for="accent" data-i18n="lblAccent">Accent</label>
        <select id="accent"><option value="us" data-i18n="aUs"></option><option value="gb" data-i18n="aGb"></option><option value="au" data-i18n="aAu"></option></select></div>
      <div class="field"><label for="voice" data-i18n="lblVoice">Voice</label><select id="voice"></select></div>
      <div class="field"><label for="rate"><span data-i18n="lblSpeed">Speed</span> <span id="rateV"></span></label>
        <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.95"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="startBtn" data-i18n="start">Start</button>
      <button class="btn ghost" id="testBtn" data-i18n="test">Test sound</button>
      <button class="btn ghost" id="clearBtn" data-i18n="clear">Clear</button>
    </div>
    <div class="msg" id="msg" hidden></div>
  </div>
</section>

<!-- exam mode -->
<section id="vExam" hidden>
  <div class="card">
    <h2 data-i18n="exTitle">Listening test</h2>
    <div class="status" id="exStatus" role="status"></div>
    <button class="btn primary big" id="playOnce" data-i18n="play">Play (once)</button>
    <label class="lbl" for="notes" style="margin-top:18px" data-i18n="notes">Your notes</label>
    <textarea class="paste short" id="notes" data-i18n-ph="notesPh" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="actions">
      <button class="btn primary" id="showTr" disabled data-i18n="showTr">Show transcript</button>
      <button class="btn ghost" id="exSetup" data-i18n="setup">Change text / settings</button>
    </div>
    <div id="trWrap" hidden>
      <div class="tr-list" id="trList"></div>
      <div class="actions"><button class="btn ghost" id="exAgain" data-i18n="again">Try again</button></div>
    </div>
  </div>
</section>

<!-- dictation mode -->
<section id="vDict" hidden>
  <div class="card" id="dCard">
    <h2 data-i18n="dTitle">Dictation</h2>
    <div class="prog" id="dProg"></div>
    <div class="actions" style="margin-top:0">
      <button class="btn primary" id="dPlay">▶ <span data-i18n="dPlay">Play</span></button>
      <button class="btn ghost" id="dSlow">🐢 <span data-i18n="dSlow">Slow</span></button>
      <span class="meta" style="align-self:center" id="dPlays"></span>
    </div>
    <textarea class="paste short" id="dType" data-i18n-ph="dPh" style="margin-top:14px" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    <div class="actions">
      <button class="btn primary" id="dCheck" data-i18n="check">Check</button>
      <button class="btn ghost" id="dNext" hidden data-i18n="next">Next</button>
      <button class="btn ghost" id="dSetup" data-i18n="setup">Change text / settings</button>
    </div>
    <div id="dRes" hidden>
      <div class="score" id="dScore" dir="auto"></div>
      <div class="diff" id="dDiff"></div>
      <div class="legend" data-i18n="legend"></div>
    </div>
  </div>
  <div class="card" id="dSum" hidden>
    <h2 data-i18n="sumTitle">Result</h2>
    <div class="sum-row">
      <div class="stat"><span class="v" id="sAvg">–</span><span class="l" data-i18n="sumAvg">Average accuracy</span></div>
      <div class="stat"><span class="v" id="sExact">–</span><span class="l" data-i18n="sumExact">Sentences exact</span></div>
      <div class="stat"><span class="v" id="sPlays">–</span><span class="l" data-i18n="sumPlays">Total plays</span></div>
    </div>
    <div id="sWeak"></div>
    <div class="actions">
      <button class="btn primary" id="sRestart" data-i18n="restart">Restart</button>
      <button class="btn ghost" id="sSetup" data-i18n="setup">Change text / settings</button>
    </div>
  </div>
</section>

<div class="backrow"><a class="btn ghost" href="index.html" data-i18n="backHome">← Back to home</a></div>
<div class="foot"><span data-i18n="foot"></span><span class="credit">Built by zenithra / Soheil Mohajer &amp; Shayan Shamsvari</span></div>
</div>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- i18n ---------- */
const I18N={
en:{brandSub:'Listening practice',back:'Home',title:'Listening practice',
 lead:'Paste an English text and listen to it. In Exam mode the audio plays only once and the text stays hidden until the end. In Dictation mode you type each sentence you hear and see exactly what you missed.',
 lblText:'English text (the transcript)',ph:'Paste the transcript here…',lblMode:'Mode',mExam:'Exam (play once)',mDict:'Dictation (sentence by sentence)',
 lblAccent:'Accent',aUs:'American',aGb:'British',aAu:'Australian',lblVoice:'Voice',lblSpeed:'Speed',
 start:'Start',test:'Test sound',clear:'Clear',
 noVoice:'No voice for this accent was found on this device, so another English voice is used.',noTTS:'This browser cannot read text aloud.',empty:'Paste a text first.',
 exTitle:'Listening test',exReady:'Press Play. The audio plays once and cannot be repeated.',exPlaying:'Playing… it cannot be replayed, so take notes.',exDone:'Finished. You can now show the transcript.',
 play:'Play (once)',played:'Played',notes:'Your notes',notesPh:'Write what you hear…',showTr:'Show transcript',setup:'Change text / settings',again:'Try again',backHome:'← Back to home',
 dTitle:'Dictation',dProg:'Sentence',of:'of',dPlay:'Play',dSlow:'Slow',dPlays:'plays',dPh:'Type what you hear…',check:'Check',next:'Next',finish:'Finish',
 accL:'accuracy',missL:'missed',extraL:'extra',legend:'Red = missed word · Struck through = extra word',
 sumTitle:'Result',sumAvg:'Average accuracy',sumExact:'Sentences exact',sumPlays:'Total plays',restart:'Restart',retryS:'Retry',weakT:'Weakest sentences',
 typeFirst:'Type something first.',
 foot:'The voice is your device’s text-to-speech, so accents and speed are close to, but not the same as, the real exam.'},
fa:{brandSub:'تمرین لیسنینگ',back:'خانه',title:'تمرین لیسنینگ',
 lead:'یه متن انگلیسی بچسبون و بهش گوش بده. توی حالت آزمون، صدا فقط یک‌بار پخش می‌شه و متن تا آخر مخفی می‌مونه. توی حالت دیکته، هر جمله‌ای که می‌شنوی رو تایپ می‌کنی و دقیق می‌بینی چی رو جا انداختی.',
 lblText:'متن انگلیسی (ترنسکریپت)',ph:'متن رو اینجا بچسبون…',lblMode:'حالت',mExam:'آزمون (فقط یک‌بار پخش)',mDict:'دیکته (جمله‌به‌جمله)',
 lblAccent:'لهجه',aUs:'آمریکایی',aGb:'بریتیش',aAu:'استرالیایی',lblVoice:'صدا',lblSpeed:'سرعت',
 start:'شروع',test:'تست صدا',clear:'پاک کردن',
 noVoice:'برای این لهجه صدایی روی این دستگاه پیدا نشد؛ از یه صدای انگلیسی دیگه استفاده می‌شه.',noTTS:'این مرورگر قابلیت خواندن متن رو نداره.',empty:'اول یه متن وارد کن.',
 exTitle:'آزمون لیسنینگ',exReady:'روی پخش بزن. صدا فقط یک‌بار پخش می‌شه و تکرار نداره.',exPlaying:'در حال پخش… تکرار نداره، پس یادداشت بردار.',exDone:'تموم شد. حالا می‌تونی متن رو ببینی.',
 play:'پخش (فقط یک‌بار)',played:'پخش شد',notes:'یادداشت‌های تو',notesPh:'اون چیزی که می‌شنوی رو بنویس…',showTr:'نمایش متن',setup:'تغییر متن / تنظیمات',again:'تلاش دوباره',backHome:'← برگشت به خانه',
 dTitle:'دیکته',dProg:'جملهٔ',of:'از',dPlay:'پخش',dSlow:'آهسته',dPlays:'بار پخش',dPh:'اون چیزی که می‌شنوی رو تایپ کن…',check:'بررسی',next:'بعدی',finish:'پایان',
 accL:'دقت',missL:'جاافتاده',extraL:'اضافه',legend:'قرمز = کلمهٔ جاافتاده · خط‌خورده = کلمهٔ اضافه',
 sumTitle:'نتیجه',sumAvg:'میانگین دقت',sumExact:'جملهٔ بی‌نقص',sumPlays:'مجموع پخش‌ها',restart:'شروع دوباره',retryS:'تکرار',weakT:'ضعیف‌ترین جمله‌ها',
 typeFirst:'اول یه چیزی تایپ کن.',
 foot:'صدا همون تبدیل متن به گفتار دستگاه خودته، پس لهجه و سرعت به آزمون واقعی نزدیکه ولی دقیقاً مثل اون نیست.'}
};
let LANG='en';
const T=k=>(I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k;
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=T(e.dataset.i18nPh));
  meter();refreshStatus();
}
function setLang(l){LANG=l;LS.set('ielts-lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';applyI18n()}
function setTheme(t){document.documentElement.dataset.theme=t;LS.set('ielts-theme',t)}

/* ---------- text helpers ---------- */
const ABBR=/\b(Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|etc|No)\.$/i;
const splitParas=t=>t.replace(/\r/g,'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
function splitSents(p){
  const parts=p.split(/(?<=[.!?…]["'”’)]*)\s+(?=["“‘(]?[A-Z0-9])/),out=[];
  for(const s of parts){if(out.length&&ABBR.test(out[out.length-1]))out[out.length-1]+=' '+s;else out.push(s)}
  return out;
}
const sentencesOf=t=>splitParas(t).flatMap(splitSents);
const tok=t=>t.replace(/[’‘]/g,"'").match(/[A-Za-z0-9]+(?:'[A-Za-z]+)?/g)||[];
function diffOps(src,hyp){
  const A=tok(src),B=tok(hyp),a=A.map(x=>x.toLowerCase()),b=B.map(x=>x.toLowerCase());
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){ops.push({t:'ok',w:A[i]});i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1]){ops.push({t:'miss',w:A[i]});i++}
    else{ops.push({t:'extra',w:B[j]});j++}
  }
  while(i<n)ops.push({t:'miss',w:A[i++]});
  while(j<m)ops.push({t:'extra',w:B[j++]});
  const c=t=>ops.filter(o=>o.t===t).length,ok=c('ok'),miss=c('miss'),extra=c('extra');
  return{ops,ok,miss,extra,acc:ok+miss+extra?ok/(ok+miss+extra)*100:100};
}
function renderDiff(el,ops){
  el.replaceChildren();
  ops.forEach(o=>{const s=document.createElement('span');s.className=o.t==='miss'?'m':o.t==='extra'?'x':'';s.textContent=o.w;el.append(s,' ')});
}

/* ---------- speech ---------- */
const tts='speechSynthesis' in window;
const ACC={us:/^en[-_]US/i,gb:/^en[-_]GB/i,au:/^en[-_]AU/i},LANGMAP={us:'en-US',gb:'en-GB',au:'en-AU'};
let all=[],run=0;
function note(t){const m=$('#msg');m.textContent=t;m.hidden=!t}
function fillVoices(){
  if(!tts)return;
  const acc=$('#accent').value;
  let list=all.filter(v=>ACC[acc].test(v.lang));
  const none=!list.length&&all.length;
  if(none)list=all;
  const sel=$('#voice');sel.replaceChildren();
  list.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';sel.append(o)});
  const saved=LS.get('ls-voice-'+acc,''),pick=list.find(v=>v.voiceURI===saved)||list.find(v=>/Google|Natural|Samantha|Daniel|Aria|Libby|Karen|Siri/i.test(v.name))||list[0];
  if(pick)sel.value=pick.voiceURI;
  note(none?T('noVoice'):'');
}
function loadVoices(){if(!tts)return;all=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));fillVoices()}
const curVoice=()=>all.find(v=>v.voiceURI===$('#voice').value)||null;
function cancel(){run++;if(tts)speechSynthesis.cancel()}
function speakSeq(texts,rate,cb){
  if(!tts){note(T('noTTS'));return false}
  cancel();const id=run;let i=0;
  const next=()=>{
    if(id!==run)return;
    if(i>=texts.length){if(cb&&cb.done)cb.done();return}
    const k=i++;if(cb&&cb.item)cb.item(k);
    const u=new SpeechSynthesisUtterance(texts[k]);
    u.lang=LANGMAP[$('#accent').value];const v=curVoice();if(v)u.voice=v;u.rate=rate;
    const go=()=>{if(id!==run)return;setTimeout(next,texts.length>1?400:0)};
    u.onend=go;u.onerror=go;
    speechSynthesis.speak(u);
  };
  next();return true;
}
const rate=()=>+$('#rate').value;

/* ---------- views ---------- */
const S={sents:[],played:false,done:false,idx:0,res:[],checked:false,plays:0,exStatusKey:'exReady'};
function view(id){
  ['vSetup','vExam','vDict'].forEach(v=>$('#'+v).hidden=v!==id);
  $('#view').scrollTop=0;
}
function toSetup(){cancel();view('vSetup')}
function meter(){
  const t=$('#src').value.trim();
  $('#meta').textContent=t?(t.split(/\s+/).length+' · '+sentencesOf(t).length+' '+(LANG==='fa'?'جمله':'sentences')):'';
}
function refreshStatus(){if(!$('#vExam').hidden)$('#exStatus').textContent=T(S.exStatusKey);updDict()}

/* ---------- exam mode ---------- */
function startExam(){
  cancel();
  S.played=false;S.done=false;S.exStatusKey='exReady';
  $('#exStatus').textContent=T('exReady');
  const b=$('#playOnce');b.disabled=false;b.textContent=T('play');
  $('#notes').value='';$('#showTr').disabled=true;$('#trWrap').hidden=true;$('#trList').replaceChildren();
  view('vExam');
}
$('#playOnce').onclick=()=>{
  if(S.played)return;
  S.played=true;const b=$('#playOnce');b.disabled=true;b.textContent=T('played');
  S.exStatusKey='exPlaying';$('#exStatus').textContent=T('exPlaying');
  const ok=speakSeq(S.sents,rate(),{done(){S.done=true;S.exStatusKey='exDone';$('#exStatus').textContent=T('exDone');$('#showTr').disabled=false}});
  if(!ok){S.played=false;b.disabled=false;b.textContent=T('play')}
};
$('#showTr').onclick=()=>{
  const L=$('#trList');L.replaceChildren();
  S.sents.forEach(s=>{
    const row=document.createElement('div');row.className='tr-item';
    const pb=document.createElement('button');pb.className='mini';pb.textContent='▶';pb.setAttribute('aria-label','Play');
    pb.onclick=()=>{
      document.querySelectorAll('.tr-item.now').forEach(x=>x.classList.remove('now'));
      row.classList.add('now');
      speakSeq([s],rate(),{done(){row.classList.remove('now')}});
    };
    const tx=document.createElement('div');tx.textContent=s;
    row.append(pb,tx);L.append(row);
  });
  $('#trWrap').hidden=false;$('#trWrap').scrollIntoView({behavior:'smooth',block:'start'});
};
$('#exAgain').onclick=startExam;
$('#exSetup').onclick=toSetup;

/* ---------- dictation mode ---------- */
function startDict(){
  cancel();S.idx=0;S.res=[];
  $('#dSum').hidden=true;$('#dCard').hidden=false;
  showItem();view('vDict');
}
function updDict(){
  if($('#vDict').hidden||$('#dCard').hidden)return;
  $('#dProg').textContent=T('dProg')+' '+(S.idx+1)+' '+T('of')+' '+S.sents.length;
  $('#dPlays').textContent=S.plays+' '+T('dPlays');
  $('#dNext').textContent=T(S.idx>=S.sents.length-1?'finish':'next');
}
function showItem(){
  S.checked=false;S.plays=0;
  $('#dType').value='';$('#dRes').hidden=true;$('#dNext').hidden=true;$('#dCheck').hidden=false;
  updDict();
}
function playItem(slow){
  S.plays++;updDict();
  speakSeq([S.sents[S.idx]],slow?Math.max(0.5,rate()*0.7):rate());
}
$('#dPlay').onclick=()=>playItem(false);
$('#dSlow').onclick=()=>playItem(true);
$('#dCheck').onclick=()=>{
  const hyp=$('#dType').value;
  if(!hyp.trim()){note(T('typeFirst'));return}
  note('');cancel();
  const r=diffOps(S.sents[S.idx],hyp);
  S.res[S.idx]={acc:r.acc,miss:r.miss,extra:r.extra,plays:S.plays};
  const sc=$('#dScore');sc.className='score'+(r.miss+r.extra===0?' good':'');
  sc.textContent=r.acc.toFixed(1)+'% '+T('accL')+' · '+T('missL')+' '+r.miss+' · '+T('extraL')+' '+r.extra;
  renderDiff($('#dDiff'),r.ops);
  $('#dRes').hidden=false;$('#dNext').hidden=false;S.checked=true;updDict();
  $('#dRes').scrollIntoView({behavior:'smooth',block:'nearest'});
};
$('#dNext').onclick=()=>{
  if(S.idx>=S.sents.length-1){summary();return}
  S.idx++;showItem();$('#dType').focus();
};
$('#dSetup').onclick=toSetup;
function summary(){
  const R=S.res.map((r,i)=>({r,i})).filter(x=>x.r);
  const avg=R.length?R.reduce((a,x)=>a+x.r.acc,0)/R.length:0;
  $('#sAvg').textContent=avg.toFixed(1)+'%';
  $('#sExact').textContent=R.filter(x=>x.r.miss+x.r.extra===0).length+' / '+S.sents.length;
  $('#sPlays').textContent=R.reduce((a,x)=>a+x.r.plays,0);
  const W=$('#sWeak');W.replaceChildren();
  const weak=R.filter(x=>x.r.miss+x.r.extra>0).sort((a,b)=>a.r.acc-b.r.acc).slice(0,3);
  if(weak.length){
    const h=document.createElement('div');h.className='lbl';h.textContent=T('weakT');W.append(h);
    weak.forEach(x=>{
      const row=document.createElement('div');row.className='weak';
      const t=document.createElement('span');t.textContent=(x.i+1)+'. '+S.sents[x.i].slice(0,70)+(S.sents[x.i].length>70?'…':'')+' — '+x.r.acc.toFixed(0)+'%';
      const b=document.createElement('button');b.className='mini';b.textContent=T('retryS');
      b.onclick=()=>{S.idx=x.i;$('#dSum').hidden=true;$('#dCard').hidden=false;showItem();$('#view').scrollTop=0};
      row.append(t,b);W.append(row);
    });
  }
  $('#dCard').hidden=true;$('#dSum').hidden=false;$('#view').scrollTop=0;
}
$('#sRestart').onclick=startDict;
$('#sSetup').onclick=toSetup;

/* ---------- setup events ---------- */
function start(){
  const t=$('#src').value.trim();
  if(!t){note(T('empty'));return}
  S.sents=sentencesOf(t);
  if(!S.sents.length){note(T('empty'));return}
  note('');
  if($('#mode').value==='dict')startDict();else startExam();
}
$('#startBtn').onclick=start;
$('#testBtn').onclick=()=>speakSeq(['This is a sound check. Can you hear me clearly?'],rate());
$('#clearBtn').onclick=()=>{cancel();$('#src').value='';LS.set('ls-draft','');meter();$('#src').focus()};
$('#src').addEventListener('input',()=>{LS.set('ls-draft',$('#src').value);meter()});
$('#mode').onchange=()=>LS.set('ls-mode',$('#mode').value);
$('#accent').onchange=()=>{LS.set('ls-accent',$('#accent').value);fillVoices()};
$('#voice').onchange=()=>LS.set('ls-voice-'+$('#accent').value,$('#voice').value);
$('#rate').oninput=()=>{$('#rateV').textContent=(+$('#rate').value).toFixed(2).replace(/0$/,'')+'×';LS.set('ls-rate',$('#rate').value)};
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#langBtn').onclick=()=>setLang(LANG==='fa'?'en':'fa');
window.addEventListener('pagehide',cancel);

/* ---------- boot ---------- */
setTheme(LS.get('ielts-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#src').value=LS.get('ls-draft','');
$('#mode').value=LS.get('ls-mode','exam');
$('#accent').value=LS.get('ls-accent','us');
$('#rate').value=LS.get('ls-rate','0.95');$('#rate').oninput();
setLang(LS.get('ielts-lang','en')==='fa'?'fa':'en');
if(tts){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}else note(T('noTTS'));
})();
</script>
</body>
